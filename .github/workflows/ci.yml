name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit firefox
        if: matrix.node-version == 22
      - name: Allow Chromium sandbox user namespaces
        if: matrix.node-version == 22
        run: |
          # The ephemeral Ubuntu runner must permit Chromium's sandbox namespace.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: npm run test:package
        if: matrix.node-version == 22
      - run: npm run test:browser
        if: matrix.node-version == 22
      - run: npm run test:integration
        if: matrix.node-version == 22
      - run: npm run docs:site
        if: matrix.node-version == 22
      - run: npm run test:site
        if: matrix.node-version == 22
      - uses: actions/upload-artifact@v4
        if: always() && matrix.node-version == 22
        with:
          name: browser-evidence-node-${{ matrix.node-version }}
          path: test-results/
          if-no-files-found: error
