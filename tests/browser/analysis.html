<!doctype html><html><body><div id="chart" style="width:1050px;height:900px"></div>
<script type="module">
// Isolated browser input, never used by production consumers.

import {runtimeBindings} from '/src/analysis/bindings.ts'
const historyResult=(query,rows)=>{
 if(query.kind==='before'){
  const eligible=rows.filter(bar=>bar.timestamp<query.before),selected=eligible.slice(-query.countBack)
  return {bars:selected,hasMoreBefore:eligible.length>selected.length}
 }

}
window.historyResult=historyResult
window.runtimeBindings=runtimeBindings
const external={name:'example:combo',shortName:'组合演示',calcParams:[3,'close',false],figures:[{key:'value',type:'line'}],calc:(bars,i)=>bars.map((b,index)=>({value:index<i.calcParams[0]-1?undefined:b[i.calcParams[1]]*(i.calcParams[2]?2:1)}))}
