<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><body style="margin:0"><p>级别提醒验收：隔离合成行情与提交替身，真实图表引擎。</p><div id="chart" style="width:100%;height:850px"></div><script type="module">

 async seed({kind='fibonacciLine',legacy=false,owner='local',count=7,id='seed-'+crypto.randomUUID()}={}){
  const price=bars.at(-1).close,anchors=kind==='horizontalStraightLine'?[{kind:'market',timestamp:bars.at(-20).timestamp,value:price}]:[{kind:'market',timestamp:bars.at(-20).timestamp,value:price-5},{kind:'market',timestamp:bars.at(-10).timestamp,value:price+5},...(kind==='fibonacciExtension'?[{kind:'market',timestamp:bars.at(-1).timestamp,value:price}]:[])]

 },
