<!doctype html><html><meta charset="utf-8"><body style="margin:0"><p>绘图压力测试：隔离合成行情，不是真实业务数据。</p><div id="charts" style="width:1200px;display:grid;gap:8px"></div><script type="module">

window.requestAnimationFrame=callback=>{const owned=/klinecharts|\/src\//.test(new Error().stack);return originalFrame(time=>{if(owned&&current){current.renderCallbacks++;measured(()=>callback(time))}else callback(time)})}
originalAdd.call(window,'pointermove',event=>{

},true)

const host=document.querySelector('#charts'),period={multiplier:1,timespan:'minute',text:'1m'};let charts=[],bars=[],subscriptions=0,readyPromises=[],callbacks=new Map(),oracle={volume:0,amount:0}
function volumeObjects(){return ['anchoredVwap','fixedRangeVolumeProfile'].map((name,index)=>{const anchors=[bars[0],...(index?[bars.at(-1)]:[])].map(b=>({kind:'market',timestamp:b.timestamp,value:b.close}));return {logicalId:`volume-${index}`,owner:'local',anchors,presentation:{name:index?'量价区间':'量价起点'},parameters:index?{rows:192,valueArea:.7,mode:'total',algorithm:'bar-range-uniform-v1'}:{source:'hlc3',algorithm:'bar-price-volume-v1'},overlay:{id:`volume-${index}`,name,paneId:'candle_pane',groupId:'drawing_tools',points:anchors.map(a=>({timestamp:a.timestamp,value:a.value})),styles:null,extendData:null,visible:true,lock:false}}})}

function objects(pro,n){
 const chart=pro.getChart(),visible=chart.getVisibleRange(),first=Math.max(0,Math.ceil(visible.realFrom)+3),last=Math.min(bars.length-1,Math.floor(visible.realTo)-3),span=Math.max(8,last-first-10),axis=chart.getYAxes({paneId:'candle_pane'})[0],height=chart.getSize('candle_pane','main').height,base=axis.convertFromPixel(height*.5),step=Math.abs(axis.convertFromPixel(height*.75)-axis.convertFromPixel(height*.25))/40

  const fraction=i/n,name=fraction<.5?'segment':fraction<.7?(i%2?'rect':'textAnnotation'):fraction<.9?'brush':i%2?'fibonacciLine':'priceChannelLine',start=first+(i*7%Math.floor(span)),value=base+(i%21-10)*step
  const count=name==='brush'?64:name==='textAnnotation'?1:name==='priceChannelLine'?3:2
  const anchors=Array.from({length:count},(_,j)=>{const index=Math.min(bars.length-1,start+(name==='brush'?j%8:Math.min(j*3,7)));return {kind:'market',timestamp:bars[index].timestamp,value:value+(name==='brush'?Math.sin(j/4)*step*2:j*step*.5)}})
  return {logicalId:id(i),owner:'local',anchors,presentation:{name:'压测 '+String(i).padStart(4,'0')},overlay:{id:id(i),name,paneId:'candle_pane',groupId:'drawing_tools',points:anchors.map(a=>({timestamp:a.timestamp,value:a.value})),styles:null,extendData:name==='textAnnotation'?'压测文字\n64点笔迹':null,visible:true,lock:false}}
 })

 this.stop();const sample={cpu:0,renderCallbacks:0,received:performance.now()};current=sample
 bars[bars.length-1]={...bars.at(-1),volume:bars.at(-1).volume+1};measured(()=>{for(const callback of callbacks.values())callback({...bars.at(-1)})});await frame()

  const chart=new KLineChartPro({container,...resources,symbol:{ticker:'SYNTHETIC.X',pricePrecision:4,market:'test',exchange:'X',priceCurrency:'USD'},period,mainIndicators:['MA'],subIndicators:['VOL','MACD'],onDataReady:()=>resolve(),datafeed:{searchSymbols:async()=>[],getHistoryKLineData:async(_s,_p,q)=>({bars:q.kind==='before'?bars.filter(b=>b.timestamp<q.before):bars.filter(b=>b.timestamp>=q.from&&b.timestamp<q.to),basis:'isolated-unadjusted',hasMoreBefore:false}),subscribe:(_s,_p,callback)=>{subscriptions++;callbacks.set(container,callback)},unsubscribe:()=>{subscriptions--;callbacks.delete(container)}}});charts.push(chart)
 }
 await Promise.all(readyPromises)
 const deadline=performance.now()+10000;while(!charts.every(p=>['MA','VOL','MACD'].every(name=>p.getChart().getIndicators({name})[0]?.result.length===count))){if(performance.now()>deadline)throw Error('真实指标计算未完成');await new Promise(r=>setTimeout(r,1))}
 for(const pro of charts){pro.restoreDrawings('local',[...objects(pro,n),...(volume?volumeObjects():[])]);if(pro.getChart().getOverlays().length!==n+(volume?2:0))throw Error('压测对象未完整进入真实引擎');if(volume&&!Object.values(pro.getDrawingState().analytics).every(s=>s.status==='ready'))throw Error('量价工具未计算完成')}

 const drawn=charts.map(p=>{const c=p.getChart(),size=c.getSize('candle_pane','main');return {count:c.getOverlays().length,visible:c.getOverlays().filter(o=>o.visible).length,inBounds:c.getOverlays().filter(o=>{const p=c.convertToPixel(o.points[0],{paneId:'candle_pane'});return p.x>=0&&p.x<=size.width&&p.y>=0&&p.y<=size.height}).length,pane:size}})
