<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><body style="margin:0"><p>隔离浏览器验收：合成 OHLCV，不连接业务后端或真实交易。</p><div id="chart" style="width:1100px;height:850px"></div><script type="module">
import {KLineChartPro} from '/src/chart.ts'

window.fixtureBars=makeBars(2000);window.states=[];window.errors=[];window.historyReads=[]
window.pro=new KLineChartPro({container:document.querySelector('#chart'),symbol:{ticker:'TEST.X',exchange:'TEST',market:'test',priceCurrency:'USD',pricePrecision:4},period:{multiplier:1,timespan:'minute',text:'1m'},mainIndicators:[],subIndicators:[],onDataReady:()=>window.ready=true,onDataState:state=>window.dataState=state,onDrawingStateChange:state=>{window.states.push(state);if(states.length>100)states.shift()},onError:e=>window.errors.push(e.message),datafeed:{searchSymbols:async()=>[],getHistoryKLineData:async(_symbol,_period,query)=>{window.historyReads.push({...query});if(window.historyGate)await window.historyGate;return {bars:query.kind==='before'?window.fixtureBars.filter(b=>b.timestamp<query.before):window.fixtureBars.filter(b=>b.timestamp>=query.from&&b.timestamp<query.to),basis:'isolated-raw',hasMoreBefore:false}},subscribe:(_s,_p,callback)=>window.pushBar=callback,unsubscribe:()=>window.pushBar=undefined,subscribeStatus:(_s,_p,callback)=>{window.pushStatus=callback;return()=>window.pushStatus=undefined}}})

</script></body></html>
